# Acumen（知微）配置示例。
#
# 安装后不用改任何一项就能用：首次启动会按默认值生成 ~/acumen/config.toml，之后升级带来的
# 新字段也会自动补进去，不会覆盖已有取值，解析失败也不会覆盖原文件。日常修改用控制台或
# 群里的 /ctl。每一项的完整说明在源码里该字段的 /// 注释，这份文件解释的是
# 「这一项做什么、取什么值、为什么是这个默认值」。
#
# 段落按注册表顺序排（也就是 /help 与 /ctl list 的顺序）。写法约定：
#   - 键名与 [oai]/[ambient] 这类配置键一律照原样写，不翻译、不改写；
#   - 指令写在正文里时带当前前缀（默认 /），能整条抄走。
# 直接编辑文件前先 acumen stop：运行中的实例退出时会用内存里那份配置覆盖文件。

# 指令前缀，可配多个。改掉之后所有指令与提示里的前缀跟着变。
command_prefix = ["/"]
# 网页截图与卡片出图的 Chrome/Chromium 路径；留空即用安装时装好的 Termux chromium-browser。
# browser_path = "/data/data/com.termux/files/usr/bin/chromium-browser"

# 全局群过滤与各插件的 channel 是独立规则。
# 启用白名单：只允许白名单群；空白名单禁止所有群，忽略黑名单。
# 白名单关闭时才检查启用的黑名单；两个开关均关闭时允许所有群。
[global_filter]
enable_blacklist = false
blacklist = []
enable_whitelist = false
whitelist = []

# 连接哪些 Satori 实现端，一段 [[bots]] 一个。
# 默认两段跟随本机的模块：module 写模块 ID，端口与令牌每次连接前从模块自己的设置里现读
# （经 su），在模块管理页改了令牌这边不用跟着改；没装的那个模块自动跳过。
[[bots]]
enabled = true
protocol = "satori"
module = "satori_qq"   # 知弦：QQ

[[bots]]
enabled = true
protocol = "satori"
module = "satori_wx"   # 知言：微信；send_allow 白名单之外的会话收得到、回不出去

# 也可以写明地址与令牌连别处的实现端；写了 url / access_token 就以写的为准。
# 环境变量 ACUMEN_SATORI_TOKEN 会盖掉每一段的令牌，连两个实现端时别设它。
# 微信的 wxid、群号（…@chatroom）原样当字符串用：群过滤、插件白名单直接写它们。
# [[bots]]
# enabled = true
# protocol = "satori"
# url = "http://127.0.0.1:5500"
# access_token = ""

# 本地测试用的假适配器，不连任何平台；acumen run 前台运行时自动启用。
# [[bots]]
# enabled = true
# protocol = "console"

# ============================================================================
# 系统 · 运维
# ============================================================================

# 过滤心跳与元事件。开着不会有任何可见输出，只在流水线最前面挡掉噪声。
[meta_filter]
enabled = true

# 插件控制：全局开关与配置的统一入口，也是唯一一条写配置的路径。
# 聊天里走 /ctl，内置 agent 走 `acumen_plugins` 工具（见 docs/CONTROL.md）。两者都按这份 admins 认号主。
[ctl]
enabled = true
# 维护者的用户 ID（QQ 号、wxid……）。空列表表示只允许本机控制台管理，聊天里谁也不许改。
# 例如 ["123456789"]（ID 一律写成字符串，同 Satori 协议）。改这一项要在私聊或控制台里做——群里的 ctl 动不了 admins。
admins = []
# 允许内置 agent 用 acumen_plugins 工具改插件开关与配置；关掉后它只能看、不能改。
agent_control = true
# 号主以外的人（房间里的客人）提出时，agent 是否也可以动手改。凭据、管理员、控制台、模型供应商这几类入口无论谁问都不开放。
guest_control = true
# 用法、状态、配置与差异是否排版成卡片图；短反馈（开关、设置、重置、报错）始终走纯文本。
# 网页卡片需要 Chrome/Chromium 与系统中日韩字体；出图失败时自动回退纯文本。
image_enabled = true
image_scale = 3.0

# 把运行状况、插件配置、搭话与日志摆到本机网页上。它是图形界面与终端共用的后端：
# 关掉之后命令行一切照旧，群里的指令、排期与推送也都不受影响。
# 默认只绑回环地址（只有本机能连），并且要口令。
[console]
enabled = true
# 监听的地址。改成 0.0.0.0 会让同一局域网里的设备也能连，
# 那时口令就是唯一的门——只在自己信得过的网络里这么做。
bind = "127.0.0.1"
# 监听的端口。
port = 7801
# 管理面板的端口：面板是单独托管的轻量进程（acumen --panel），知微停着也打得开，
# 能在网页上启动、停止、更新；知微在跑时它就是同一个控制台。0 = 不开。
# 面板读的是这一项本身，改了要 acumen restart 才换端口。
panel_port = 7800
# 访问口令。留空表示首次启动自动生成一个，存在 data/console/token（0600），
# 启动日志里那条带 ?t= 的完整地址就是用它拼出来的。
token = ""
# 日志面板往回保留多少行。上限 2000，写更大也只按 2000 收。
log_lines = 400

# 入群欢迎：进群 @ 一句欢迎（可配图）、退群送别；可选入群验证与加群申请自动审批。
# 默认关着；打开前先用 channel 圈定要欢迎的群。模板占位符：{at} 真 @、{name} 名字、
# {user_id} 号码、{group} 群名、{group_id} 群号；验证相关的另有 {timeout} {remaining} {answer} {punish}。
[welcome]
enabled = false

[welcome.channel]
# 白名单非空时只在这些群生效；黑名单里的群一律不生效；两边都空 = 账号所在的全部群。
white = []
black = []

[welcome.join]
enabled = true
text = "欢迎 {at} 加入{group}～\n先看看群公告，有问题直接问。"
# 配图：图片直链，或 data/welcome/ 下的文件名（也可写绝对路径）；多张时每次随机一张。
images = []
# 这么多秒内进群的人合并成一条欢迎（不刷屏）；0 = 来一个欢迎一个。最多 120。
merge_seconds = 0

[welcome.leave]
enabled = false
# 自己退群时说的话。
text = "{name}（{user_id}）离开了本群。"
# 被移出时说的话，多一个 {operator}；留空则同 text。
kicked_text = "{name}（{user_id}）已被移出本群。"

[welcome.verify]
# 入群验证：新人要在时限内发出指定内容；账号不是群主或管理员时自动跳过。
enabled = false
# 时限（秒，30–86400）。
timeout_seconds = 300
# 回答里含其中任一句即通过（不分大小写）；留空且不用验证码 = 说任意一句话就行。
answers = []
# 每人发一个随机 4 位数验证码，回答须含这串数字（优先于 answers）。
code = false
# 剩余这么多秒时 @ 新人提醒一次；新提醒顶替旧的，验证有了结果就把提醒撤掉。
remind_seconds = [60]
# 超时怎么办：kick 移出、mute 禁言、none 只记一笔。
action = "kick"
# action = mute 时禁言多久（秒）。
mute_seconds = 86400
# 移出时拒绝再次申请。
kick_permanent = false
# 验证通过前他发的其他消息撤回掉（防新号进群就发广告）。
recall_unverified = false
prompt_text = "请在 {timeout} 内发送「{answer}」完成验证，超时将{punish}。"
remind_text = "{at} 验证还剩 {remaining}：发送「{answer}」即可，超时将{punish}。"
# 通过时说的话；留空不说。
pass_text = "{at} 验证通过，欢迎正式入群！"
# 超时处理后说的话；留空不说。
fail_text = "{name} 未在时限内完成入群验证，已{punish}。"

[welcome.approve]
# 加群申请：附言里含关键词的自动同意。
enabled = false
# 附言含其中任一个（不分大小写）就同意；留空 = 全部同意。
keywords = []
# 对不上关键词时拒绝；否则留给管理员（群管理开放时智能体也看得到）。
reject = false
# 拒绝时给申请人看的话。
reject_message = "答案不对，看清入群问题再来～"

# 每个群单独的文案与开关，只写想改的项，例如：
# [welcome.groups."123456"]
# join_text = "欢迎 {at}！本群只聊技术。"
# verify_enabled = true
# answers = ["我已阅读群规"]
[welcome.groups]

# 防撤回：有人撤回消息时把原文转存到 target。连撤多条合成一条合并转发。
[anti_recall]
enabled = false
# 存到哪：群号；或 private:QQ号；留空 = 号主自己的私聊（QQ 里和自己的会话）。插件页能看到去处与转存计数，也能先发一条试试。
target = ""
# 私聊里的撤回也存。
private = true
# 管理员撤回别人的消息也存（清广告时会多一些）。
operator_recalls = true
# 这些人的撤回不管（QQ 号）。
ignore_users = []
# 原文在内存里留多久（分钟，1–1440）。缓存外的只能从消息记录里找回文字摘要。
retention_minutes = 120

[anti_recall.channel]
# 白名单非空时只管这些群；黑名单里的群不管；两边都空 = 全部群。
white = []
black = []

# 奶龙提醒：认出群里的奶龙、奶蛙图，把原图与来龙去脉发到私聊或指定群，由管理员确认后处理。
# 默认只提醒；想让它顺手撤回、禁言，打开下面的 [nailong.manage]。第一张图到来时自动下载识图模型（约 45 MB）。详见 docs/nailong.md。
[nailong]
enabled = false
# 认哪几类：nailong（奶龙）、naiwa（奶蛙）。
targets = ["nailong", "naiwa"]
# 判定阈值（0.3–0.95）：越高越不容易误报，也越容易漏。只在只用本地模型（judge = "local"，或没配复核模型）时起作用。
threshold = 0.5
# 认图方式：auto = oai 里配了复核模型（下面的 ai_model）就「本地初筛 + 大模型复核」，没配就只用本地；
# local = 只用本地模型（离线、免费，误判多些）；hybrid = 本地初筛 + 大模型复核；ai = 每张图都问大模型（用量大）。
judge = "auto"
# 复核用的多模态模型，写法同 oai：供应商/模型。默认借 [oai.providers.deepseek] 的密钥。
ai_model = "deepseek/deepseek-flash"
# 本地分数低于它的直接放过，不问大模型。
ask_floor = 0.2
# 本地分数到它就不问、直接提醒；1 = 本地觉得像的一律请大模型确认（误报最少）。
sure = 1.0
# 每天最多问大模型几张（所有群合计）；用完了当天先放过，宁漏勿错。问过的图记住结论，不会重复问。
ai_daily_limit = 300
# 问一张最多等几秒。
ai_timeout_seconds = 20
# 提醒发到哪：每项写群号，或 private:QQ号（私聊）；可以写多个，留空 = 号主自己的私聊。
notify_targets = []
# 提醒里带原图，方便人工判断；关掉只发文字。
notify_image = true
# 同一群同一个人多少分钟内只提醒一次（0–1440）；期间再发只记次数。0 = 每次都提醒。
repeat_minutes = 30
# 全部群每小时最多提醒几条（0–1000）：超出只记录、不再提醒，免得刷屏。0 = 不限。
max_per_hour = 30
# 提醒文案；留空只发原图。占位符：{no} {kind} {group} {name} {user} {basis} {count} {prefix}，
# {action} 是群管理做了什么（没开时是「请确认后手动处理」）。
notify_text = "🐉 #{no} 可能是{kind}图\n{group} · {name}（{user}）\n{basis}\n本群今天第 {count} 张；{action}\n认错了引用这条回「{prefix}奶龙 不是」"
# 群主、管理员与机器人管理员发的不管。
exempt_staff = true
# 这些人发的不管（QQ 号）。
ignore_users = []
# 也看 QQ 表情商店的动画表情（商城表情）：按表情编号取图识别，表情名写着奶龙、奶蛙的直接算。
check_mface = true
# 发现的图与记录留几天（1–30）：期间「/奶龙 记录」能翻、「/奶龙 不是 编号」能改判。
keep_days = 7
# 一条消息最多看几张图（1–10）。
max_images = 4
# 动图最多抽查几帧（1–12，均匀抽，第一帧必看；哪帧像就算）。
max_frames = 4

[nailong.channel]
# 白名单非空时只管这些群；黑名单里的群不管；两边都空 = 全部群。
white = []
black = []

# 群管理（默认关）：提醒之外顺手撤回、禁言。三样都满足才动手——这里开着、账号是本群群主或管理员、
# 这张图认得有把握（大模型确认、教过、表情名写着，或本地分数到 min_score）；缺一样就照旧只提醒。
# 发图的是群主、管理员时从不动手。做了什么写进提醒，认错了回「不是」会解除禁言。
[nailong.manage]
enabled = false
# 只在这些群动手（群号）；留空 = 生效范围内账号是管理员的全部群。
groups = []
# 撤回那张图。
recall = true
# 禁言阶梯（秒）：近 window_hours 小时内第 1、2、3… 次各禁多久，超出按最后一档；0 = 不禁言。
mute_seconds = [0, 600, 3600]
# 次数按多少小时内算（1–720）。
window_hours = 24
# 只凭本地模型认的，分数到这个才动手（0.5–1）；大模型确认的、教过的、表情名写着的不看分数。
min_score = 0.9
# 动手后在群里说的话，两分钟后自动撤掉；留空不说。占位符：{at}（@ 发图的人）{kind} {action}
notice = "{at} 本群不收{kind}图，{action}"

# 把收到的消息打印到控制台日志。排查「到底有没有收到」时开它，平时关掉免得刷屏。
[logger]
enabled = true
debug = false

# 消息记录：落库到 data/bot.db，是词云、统计两个插件的共同数据源。
# 关掉它，那两个插件只会回答「没有记录」。
[recorder]
enabled = true
# 是否连机器人自己发的消息一起记。搭话的风格分析要用到自己的发言，所以默认开。
record_self = true
# 原始消息保留多少天，超期清理；0 表示不清理。清理不影响已算出的统计结果。
retention_days = 180

# 例行维护：启动时与每天按时检查更新、平滑重启，另有内存阈值兜底。
[restart]
enabled = true
# 每天在这些时刻做一次维护（HH:MM，24 小时制，可写多个，系统本地时区）。默认是群聊低峰期。
times = ["04:30"]
# 查新版本：每天维护时，以及每次启动（含重启）半分钟后；有就下载、校验、换上，再重启生效。
# 十分钟内查过的启动不再查。只对安装的发布版生效，源码构建的不动。
auto_update = true
# 除此之外每多少小时再查一次（0 = 只在启动与每日维护时查）。
check_interval_hours = 6
# 没有新版本时也重启一次，放掉长时间运行积下的内存。
daily_restart = true
# 平滑重启：等到这么多秒没有新消息、手头的消息也都处理完了再动手，免得话说一半。
quiet_seconds = 120
# 最多等多少分钟；过了仍不安静也照常重启。
max_wait_minutes = 30
# 进程 RSS 内存阈值（MB），超过就平滑重启；0 表示不做内存监控。
memory_threshold_mb = 1024
# 内存巡检间隔（分钟）。
memory_check_interval_minutes = 5
# 手动 /restart 指令是否开放。默认关闭，免得群友误触发重启。
allow_manual_restart = false
# 手动重启前等待多少秒，让「即将重启」那句通知先发出去。
restart_delay_seconds = 3

# 帮助中心：按当前注册表列出全部插件与开关状态，配置管理交给 ctl。
[help]
enabled = true
# 只在私聊应答：帮助是自己翻手册，留在群里只会刷屏。
# 打开后群里的 help 原样放行，不消耗事件；需要群内也能用时设为 false。
private_only = false
# 是否把帮助排版成卡片图；关掉或渲染失败时退回纯文本，内容与图一致。
image_enabled = true
image_scale = 3.0

# ============================================================================
# 消息 · 媒体
# ============================================================================

# 媒体与链接互转：图片或视频 → 直链，链接 → 图片或视频。
[media]
enabled = true

# 表情收藏：引用一条表情或图片后把它收下来（后来搭话的表情包库就是从这儿来的）。
[sticker]
enabled = true

# 消息撤回：引用要撤回的那条后发送 /撤回。只撤回机器人自己或明确引用到的消息。
[recall]
enabled = true
# 用户撤回触发消息后，跟随撤回机器人据此发送的回应（仅本次运行期间的近期消息）。
follow_recall = true

# 消息回显：把参数原样发回来，支持图片等富文本。测试与做卡片时用。
[echo]
enabled = true

# Markdown 转图：/md 后面直接写 Markdown（可多行），或引用一条消息只发 /md，回一张排版好的图。
# 支持标题、列表、任务清单、引用与 GFM 提示块、表格、代码（带语法着色）、脚注与链接编号。
# 链接与图片不会被加载，链接的完整地址列在图底；原始 HTML 一律当文字显示。
[markdown]
enabled = true
# 配色：light 或 dark。
theme = "light"
# 卡面宽度（CSS 像素）。宽一点每行才放得下更多字；图要在手机上全屏看，
# 字与卡宽的比例才是决定「一屏能读多少」的那一个。
width = 560
# 正文字号（CSS 像素，14 到 26）。整套字阶跟着它缩放，间距不缩：
# 字号相对卡宽越小，每行塞得下的字越多、扫读越快。
font_size = 18
# 出图倍率，1 到 4。
image_scale = 2.0
# 每页的目标高度（CSS 像素）。长文按块断页，标题不落在页尾；单个块不拆开时可以略超。
page_height = 2000
# 最多发几页，超出的不发并在消息里说明。
max_pages = 6
# 单次最多渲染多少字。
max_chars = 20000
# 单个换行按换行显示（聊天里的写法）。关掉则相邻行并成一段（CommonMark 的写法）。
keep_line_breaks = true

# GIF 工具箱：合成、变速、倒放、缩放、旋转、翻转、拆分、拼图。
[gif]
enabled = true

# 图片切分：把一张图按行列切开。行列各有上限，防止一次切出上百张图刷屏。
[image_split]
enabled = true
max_rows = 10
max_cols = 10

# 二维码：识别与生成两个方向。
# 识别：「/扫码」后附图，或引用一张图再发「/扫码」，把图里全部二维码转成文字与链接。
# 生成：「/生成二维码 内容」，或引用一条消息再发「/生成二维码」，回一张好扫的二维码图。
# 「/二维码」「/qr」两头都沾：有图就识别，没图而后面有文字就生成。
# 只响应指令，不会去扫群里的每一张图。
[qr_scan]
enabled = true
# 一次最多识别几张图（指令里附的，或被引用那条里的）。
max_images = 4
# 一张图最多找几个码，也是一条回复最多列几个。
max_codes = 12
# 一共不止一个码时，把原图发回来，每个码框出并标上与清单对应的序号。
annotate = true
# 下载加识别的总预算（秒）；到点用已经找到的结果收工。
timeout_seconds = 30
# 是否提供文字转二维码。关掉后只剩识别，「/二维码」「/qr」也只当识别用。
generate = true

# 视频解析：受支持的视频链接会自动取片并发送，不先发预览，也不要求引用回复。
[video_parse]
enabled = true
# 取片时最多下载多大（MB）。按这个数挑画质：放得下就取最清楚的一档，
# 连最低一档都超了就放弃这条链接，只在日志里写一句「最小的 360P 也有多少 MB」。
max_size_mb = 80
# 想要的最高画质：80=1080P / 64=720P / 32=480P / 16=360P。
# 未登录时 B 站只放 360P—720P（多数稿件是 720P），1080P 及以上要登录态。
prefer_quality = 64
# 成品怎么发：bubble（只发视频气泡，默认）/ file（只发群文件）/ both。
# 默认只发气泡，一份成品一条消息；要群文件的群再开成 file 或 both。
# both 也是安全的：先发气泡再发文件，两条腿各自兜错——有些群不让普通成员发群文件，
# 文件那条腿失败只是少一个文件，不会再让整条取片流程失败。与 [oai] video_send 同一套写法。
send = "bubble"
# 一次取片的总预算（秒），含挑画质、下载与上传。
# 本插件在群里只说成品那一条：取片慢不补「正在取片」，取不到也不回复，只在日志里写原因。
timeout_seconds = 300
# B 站登录 Cookie，留空即匿名。填上自己浏览器的 Cookie 才能取到 1080P。
# 形如 "SESSDATA=…; bili_jct=…; buvid3=…"，整行贴进来即可。
cookie = ""

# 语义同 [stats.channel]。
# 线上把 818965288、924989840 与 1095695449 放进了 black：这三个群已经有别的
# 解析机器人，同一条链接不必两家都各取一遍。
[video_parse.channel]
white = []
black = [
    "818965288",
    "924989840",
    "1095695449",
]

# 点歌：`点歌 <关键词>` 在 B 站搜歌、由便宜模型挑一条最贴近的结果，
# 再走 [video_parse] 的同一条链路把原片发进群。全程只在群里出成品那一条：
# 搜不到、挑不出、取不到都不吭声，原因写进日志。
# 另有手动指令「导出音频」：引用一条视频消息发过去，画面去掉、声音作为
# 音频文件发回群里（无独立配置，体积上限沿用 [video_parse].max_size_mb）。
[song]
enabled = true
# 挑结果用的模型，写 `供应商/模型`（接口取自 [oai.providers]）。
# 判断只看标题、UP 主与时长，便宜档足够。
model = "mimo/mimo-v2.6-flash"
# 交给模型的候选上限，取相关度靠前的几条。
candidates = 10
# 成品时长上限（秒）：超长的直接从候选里去掉，不让几个小时的视频进群。
max_seconds = 600
# 等模型挑结果的时间上限（秒）；等不到就退回相关度最高的候选。
timeout_seconds = 30

# 语义同 [stats.channel]。
[song.channel]
white = []
black = []

# 网页截图：消息里的网页链接自动截成图。视频站链接交给 [video_parse]，这里跳过。
[webshot]
enabled = true
# 命中这些域名的链接不截图。按域名后缀匹配，example.com 同时覆盖 a.example.com。
ignore_domains = []
# 允许截图访问内网/本机地址。默认关闭：截图会原样发回群里，开启后群友发一条
# http://127.0.0.1:6520/ 之类的链接就能把本机面板、路由器后台渲染成图片读走。
allow_private_hosts = false
# 跳过截出来没有内容的站点：没登录只能看到登录墙（抖音/快手/小红书、Instagram/X、
# 知乎、雪球、NGA、酷安等），以及从本机打开会被风控拦下的（Reddit、Quora）。
# 名单写在 src/plugins/webshot.rs 的 WALLED_DOMAINS，要额外拉黑别的域名用上面的
# ignore_domains。同一文件里的 UNCAPTURABLE_DOMAINS 另记一类「渲染不友好」的站点
# （脚本动画多、整页极长，静态截图出不来可用的图，如 dontboardme.com），那类不受
# 这个开关影响、总是跳过。
block_walled_sites = true
# 跳过微信公众号 / 服务通知（账号 `gh_` 开头：微信支付、银行交易提醒、订阅号推文）
# 和 QQ 官方机器人（Q群管家那代与 QQ 开放平台上注册的那些）发的消息。
# 它们回的是模板，里面的链接（markdown 写的「查看原文」）截图没有可看的。
# 号段前缀写在 src/plugins/webshot.rs 的 OFFICIAL_BOT_ID_PREFIXES，没有官方文档、
# 只有一份实测名单，所以段外的机器人认不出来、段里恰好有真人号也会被一起跳过。
skip_official_bots = true
# 截图视口宽度（CSS 像素）与出图倍率。1.0 即与视口同宽，调大更清晰、体积更大。
viewport_width = 1280
device_scale_factor = 1.0
# 整页截图的总高度上限（CSS 像素）：网页多长就截多长，超出就截断，并在消息里说一句。
max_height = 30000
# 单张图的目标高度（CSS 像素）。页面比这更长就切成几张，切点尽量落在文字行之间的
# 空白处，不拦腰截断一行字。QQ 对单张图的高度有上限（实测 1280 宽的图 2.8 万像素
# 以内发得出去，3.2 万像素就「rich media transfer failed」），图越长手机上也越难读。
slice_height = 6000
# 单张图的体积预算（KB）：超了就降画质重截，最多降三档。
max_image_kb = 2500
# 一次要发的图超过这个张数，就折成一条合并转发，免得长页把群聊刷成一面墙。
fold_images = 3
# JPEG 画质（0—100）。
quality = 80
# 单次截图的超时（秒）。
timeout_seconds = 30
# 手动名单：这些群不自动截图，只能用「截图 <链接>」指令（或引用一条含链接的消息）
# 现截一张。想让一个群彻底不碰截图，用下面 [webshot.channel] 的 black。
manual_channels = []

# 语义同 [stats.channel]。私聊不受白名单约束，但黑名单可以点名会话（对方的账号，
# 微信里公众号与服务通知是 `gh_` 开头的账号，如微信支付 gh_3dfda90e39d6）。
[webshot.channel]
white = []
black = []

# ============================================================================
# 互动 · 娱乐
# ============================================================================

# 群头衔：机器人为群主时，给申请者设置群专属头衔。
[group_title]
enabled = true

# 复读机：同一句话接力到阈值就跟读一次，带冷却、概率与打断复读。
[repeater]
enabled = true
# 「同一句话」的判定：允许带图片一起复读。
allow_media = true
# 自己复读自己算不算接力。默认不算，否则一个人刷两遍就能触发。
allow_same_user = false
# 至少几个人接力才复读。
min_times = 2
# 达到阈值后复读的概率（0—1）。
probability = 1.0
# 加进上下文的最长字符数，超过的不参与判定。
max_chars = 200
# 复读超过有效期就丢弃，避免消息补推或发送排队后迟到跟读。
max_delay_ms = 3000
# 两次复读之间的静默期（秒），防止连着玩。
cooldown_seconds = 15
# 指令消息不参与复读（两个人发 /help，机器人不必跟着刷）。
ignore_commands = true
# 被打断时插一句的概率（0—1）。默认不打断。
interrupt_probability = 0.0
interrupt_texts = ["打断复读", "打断施法"]
# 跟读过的话多少小时内不再跟读，哪怕群友又接力起来（记录落盘，重启不忘）。0 为只按最近 128 条淘汰。
remember_hours = 24

[repeater.channel]
white = []
black = []

# 智能对话：多智能体房间、模型与历史管理；内置 agent 房间能自己调工具。
[oai]
enabled = true
# 内置 agent 房间（管家大人、`##研究 agent`）没写模型时用哪个：留空或写 `agent` 的房间都取这里的值。
# 写成 `供应商/模型` 时按下面的 [oai.providers] 取接口；留空则退到 oai 的默认模型。
agent_default_model = "deepseek/deepseek-flash"
# 单次回复的总时间预算（秒）。
request_timeout_seconds = 300
# 单次模型请求静默这么多秒算卡死，掐掉重来一次（没有中间事件可看，所以这是单次
# 请求的上限）；卡住且还没动过工具才会重试，动过就不再重放。0 关闭。
request_stall_seconds = 180
# 不含标题/列表/代码块的短回复直接发文本，不渲染图片；置 0 表示始终渲染图片。
# 一句话的答复走文本既快又便于复制。
plain_text_max_chars = 120
# 是否把回复排版成卡片图。关掉后一律发纯文本（渲染失败本来也退回纯文本）。
image_enabled = true
# 出图倍率（1—4）。版心 520 CSS px，2 倍即 1040px 位图，最省体积又不糊。
image_scale = 2.0
# 在回复卡片页脚显示模型、耗时与工具调用轨迹。
show_trace_footer = true

# 走 /v1/images/generations 的图像模型关键字（不区分大小写、子串匹配）。
# 命中的房间把提示词交给专用绘图接口，可用 --size / --quality 指定尺寸与画质；
# 其余房间仍走聊天补全。站点上新图像模型时改这里即可。
image_models = ["gpt-image-2.5"]

# 走 Suno 文生歌的房间模型关键字。命中的房间把提示词交给中转站的 /suno/* 接口，
# 一次出两个版本，封面与音频一起发进群。提示词里可以带：
#   --标题 名字 / --风格 folk,acoustic / --版本 chirp-v5 / --纯音乐
#   发法也可以这一句自己定：--文件（只发群文件）/ --语音（只发语音气泡）/ --都发
# 正文写成 [Verse] / [Chorus] 那样的歌词体裁时按自定义模式提交（正文就是歌词），
# 否则按灵感模式提交（正文是创作描述，歌词由 Suno 自己写）。
music_models = ["suno"]
# Suno 版本（提交时的 mv）。站点接入更新版本时改这里；实测 chirp-v5 拿到的是最新一档。
music_version = "chirp-v5"
# 没写 `--文件/--语音/--都发` 时，生成的歌怎么发进群：file（群文件，可下载可保存）、
# voice（语音气泡，点开就听）、both（先发语音再补一条群文件）。默认 both——
# 语音气泡在 QQ 上时有时无（实测同一晚四条里丢了一条，模块自己还报成功），
# 发两份就是拿群文件兜底，想只听语音条就写 voice。
# 顺序是语音在前：有些群不让普通成员发群文件，文件那条腿失败（还会在实现端重试到
# 超预算）只是少一个文件，不会再补一条错，也拖不住已经发出去的语音。
music_send = "both"

# 走 OpenAI 视频任务接口（POST {base}/video/generations）的房间模型关键字。
# 房间系统提示词当风格前缀，用户那句话接在后面；可带 --秒数 8 / --竖屏 / --横屏 /
# 以及发法开关 --文件 / --视频 / --都发。
# 实际时长、音效与费用以供应商和上游模型为准。
# 别的模型用 `房间%模型` 换：veo3.1-pro、wan3.0-video-prime、sora-2、kling-video-v3……
# 注意各家渠道的分组、单次价格与所需参数不一样，换之前先确认能调通。
video_models = [
    "veo3.1",
    "veo3.",
    "sora-2",
    "doubao-seedance",
    "kling-video",
    "wan3.0-video",
    "wan2.6-t2v",
    "viduq3",
    "grok-video",
    "MiniMax-Hailuo",
    "pixverse-video",
    "luma_video",
]
# 没写 --秒数 时的默认时长，1–30 秒。视频按秒计费，短一点更省。
# 注意 veo3.1 那一档的时长由上游定（实测写 5 也按 8 秒出），这项对它能被采纳的模型才生效。
video_seconds = 5
# 没写 --文件/--视频/--都发 时，拍好的片子怎么发进群：file（群文件）、video（视频气泡）、
# both（先发视频再补一条群文件）。默认 both，理由与顺序同 music_send。
video_send = "both"
# 音乐、视频这类异步任务房间的等待上限（秒）。它们出成品常常要几分钟，
# 所以另外给一个比 request_timeout_seconds 长的预算。
media_timeout_seconds = 900

# 群聊那一层：房间开在群里时能做的事。搭话（[ambient]）走同一份能力，
# 节奏与额度是它自己那一套（见下面的 [ambient]），这张表只管房间。
[oai.chat]
# 账号在群里是群主或管理员时自动开放群管理动作（踢人、禁言、撤回群友的消息、全员禁言、
# 改群名、设精华、改他人名片）。房间只替号主和本群群主、管理员动手，客人吩咐的一律不做。
management_auto = true
# 不看账号身份、直接开放群管理动作的群号（QQ 没给权限的照样被驳回）。
management_groups = []
# 永远不开放群管理动作的群号，压过上面两项。
management_excluded = []
# 每群每天最多几次管理动作（解禁、取消精华不算）；0 不限。
management_daily = 20
# 一次发言最多几条（模型把一段话写长了，切开也算额度）。
messages_budget = 2
# 一轮最多几次写动作（发言、戳、点赞、撤回、转发……都算）。
actions_budget = 6
# 一轮最多写几条记忆、画几张图、写几首歌、拍几段视频。0 表示关掉那一项，
# 那一项的工具不挂给模型。
memo_budget = 3
draw_budget = 2
music_budget = 1
# 视频任务可能产生费用，默认关闭。与 [ambient] video_budget 分开计数：这一项管房间，
# 那一项管搭话。
video_budget = 0
# 记住群里的人和旧事（对某个群友的印象、怎么称呼他、起过的梗），落盘、跨重启，
# 与搭话共用一份。关掉之后 satori_memo 不挂给模型，已经记下的留着。
memory_enabled = true
# 表情包库上限；0 表示不攒。库是全局一份，与搭话共用。
sticker_max = 120
# 递给模型的群聊条数。
context_turns = 20
# 一段话切成几条的字数阈值；0 表示不切。
split_chars = 60
# 一条消息里的文字超过多少字就排成一页 Markdown 图再发；0 关闭。群里一堵字墙会把
# 别人的话顶走，排成图只占一条消息。只对「除了引用之外全是文字」的消息生效：
# 带图、文件、@ 的那些各有各的落点，照原样发。渲染失败会退回原文。
long_text_chars = 240
# 工具白名单（逗号分隔）。留空表示有什么挂什么：本机那七件（含 view_image 看图）、群聊那一套与联网。
tools = ""
# 发出前的时效窗口（秒）：群里又有人说话就整条不发，先读一遍现场再决定。0 关闭。
# 房间里默认关：用户问一句就答一句，中间群里聊了什么与这次回答无关。
freshness_seconds = 0
# QQ 内核正在输入指示（实验性、仅 satori-qq，失败不妨碍发消息）。
qq_typing = false
# 仅在实际准备回复时，通过 QQ 内核标记本群已读（每轮一次、失败忽略）。
qq_mark_read = false
# 一次媒体生成（图、歌、片）最多等多久（秒）。
media_deadline_seconds = 240

# 供应商表：房间模型或判定模型写 `供应商/模型` 时按名字取这里的接口与密钥，
# 例如 `##助手 agent deepseek/deepseek-flash`。不带前缀的走 oai 自己的默认接口
# （`oai 地址 密钥` 配的那个）；名为 apilio 的供应商没单独配置时也回退到默认接口。
# 认得的供应商（deepseek、mimo、siliconflow、moonshot、zhipu、dashscope、volcengine、
# minimax、openrouter、openai、anthropic、gemini、xai、groq、ollama）只填 api_key 就行：
# api_base 留空取官方地址，api_key 留空读环境变量（如 DEEPSEEK_API_KEY）。
# 最省事的是号主发一句 `oai deepseek sk-…`：验过密钥再写进这里，并撤回那条消息。
[oai.providers.deepseek]
api_base = "https://api.deepseek.com/v1"
api_key = "sk-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"

# 高峰使用 peak.model = "mimo/mimo-v2.6-flash" 时还需配置 MiMo 官方接口。
# [oai.providers.mimo]
# api_key = "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"

# 房间模型与判定模型都支持 `:强度` 后缀，强度取 off/minimal/low/medium/high。
# 也可建房后单独改：`房间%deepseek-flash:high`。

# 模型列表过滤：中转站一次能吐出上千个 id，`/%` 只展示这里筛出来的那些。
# 两份关键字都不区分大小写、按子串匹配；drop 优先于 keep。
# keep 留空表示不筛选，全部接受。站点上新/下架时改这里即可，不必改代码：
#   /ctl set oai model_filter.keep ["gpt-5.6", "claude-opus-5"]
[oai.model_filter]
keep = [
    "gpt-5.6", "gpt-5.5", "gpt-image-2.5",
    "claude-opus-5", "claude-fable-5", "claude-sonnet-5", "claude-opus-4-8",
    "gemini-3.8-flash", "gemini-3.7-flash", "gemini-3.1-pro-preview",
    "gemini-3-pro-image", "gemini-3.1-flash-image",
    "grok-4.6", "grok-4.5",
    "deepseek-v4-pro", "deepseek-v4-flash", "kimi-k3", "kimi-k2.6",
    "qwen3.8-max", "glm-5.3", "minimax-m2.7", "mimo-v2.5", "doubao-seedream-5-0",
]
# 同一模型的重复投影：发布日期快照、低算力/低分辨率档位、中转站自加的聚合别名。
drop = [
    "-2025-", "-2026-", "-thinking-low", "-thinking-minimal", "thinking-*",
    "-lite", "-512px", "-2k", "-4k", "-all", "-beta",
    "customtools", "highspeed", "lightning", "-image-preview", "-vision-exp",
]

# 联网搜索：内置 agent 房间的 web_search / web_fetch 两个出网工具。
# 默认开启；群聊搭话那边也默认开着（[ambient] search_enabled），两个开关彼此独立，
# 要关就各关各的。后端、预算与密钥在这里配一次，两边共用。
# 这里是「没单设过的房间」的默认值；每间房用符号指令自己定：`房间?` 换一边、
# `房间?开` / `房间?关` 明确指定、`房间?默认` 回到这里。开着只是让模型能查，
# 搜不搜由它自己按这句话需不需要判断，不会每轮都搜。
[oai.search]
enabled = true
# 后端顺序：前一个不可用（没配密钥）或失败（超时/报错/零结果）就顺延到下一个。
# `"auto"` 展开成「配好了密钥的后端（优先）+ 免密钥抓取（兜底）」。
# 内置：deepseek（官方搜索/抓取接口，最优先；[oai.providers.deepseek] 指向官方
#       api.deepseek.com 时自动借用它的密钥，不用在下面再配；每次成功约 0.005 元）；
#       bing、duckduckgo（免密钥抓取，中文查询会先收紧汉字间的空格再交给 Bing）；
#       tavily、brave、serper、exa、bocha（在本表下面的 backends 里写 api_key）；
#       searxng（在 backends 里写 base_url，指向自建实例）。
# 同一个后端可以写多份密钥（空白或逗号分隔），前一份失败（额度用尽、限流）
# 就顺延到下一份——同一家的第二个账号就是第二份额度。
# 免密钥抓取够日常用，但中文时效性内容（比赛战况、新版本）的召回不如商业接口；
# 只要在下面配上 tavily 之类的密钥，它就会自动排到最前面。
providers = ["auto"]
# 一轮对话里搜索与抓取加起来最多几次。
max_uses = 4
# 单个后端或一次抓取超时（秒）。
timeout_seconds = 20
# 每次搜索最多返回几条。
results = 8

# 需要凭据的后端在这里配；不配就自动从链上跳过，不会白白失败一次。
# deepseek 想单独用另一份密钥（而不是借 [oai.providers.deepseek] 的）才需要写：
# [oai.search.backends.deepseek]
# api_key = "sk-xxxxxxxx"
# [oai.search.backends.tavily]
# api_key = "tvly-xxxxxxxx"
# # 多份密钥顺延；下面是两次不同登录各自的 key，用空白或逗号分隔都行
# # api_key = "tvly-aaaaaaaa tvly-bbbbbbbb"
# [oai.search.backends.brave]
# api_key = "BSAxxxxxxxx"
# [oai.search.backends.serper]
# api_key = "xxxxxxxx"
# [oai.search.backends.exa]
# api_key = "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
# [oai.search.backends.bocha]
# api_key = "sk-xxxxxxxx"
# [oai.search.backends.searxng]
# base_url = "https://searx.example.com"

# 群聊搭话：独立插件，复用 [oai] 的模型接入层（接口、密钥、供应商、联网、绘图）。
# 让内置 agent 以固定人格在指定群里旁听，绝大多数时候沉默。
# 完整字段与取舍见 docs/ambient.md；人设在 data/ambient/persona.md。
[ambient]
enabled = false
# 开启搭话的群号；空列表等于不开启。
groups = []
# 账号在群里是群主或管理员时，人格自动以管理员身份管群，照 data/ambient/rules.md 与
# rules/<群号>.md 的群规（见 docs/ambient.md「管群」）。
management_auto = true
# 不看账号身份、直接开放人格群管理的群号。还须 QQ 权限。
management_groups = []
# 永远不让人格管的群号，压过上面两项。
management_excluded = []
# 每群每天最多几次管理动作（解禁、取消精华不算）；0 不限。
management_daily = 20
# 判定模型（便宜、能看图）。写 `供应商/模型` 时按 [oai.providers] 取接口；
# 默认走 DeepSeek 官方的 V4.1 Flash（API 模型名 deepseek-flash）。
gate_model = "deepseek/deepseek-flash"
# 判定读的「兴趣画像」。默认（不写这一行）用内置浓缩画像，比完整写作人设省一多半 token 且不影响判断。
# 想自定义就取消注释写一段短文（只写对什么感兴趣、避开什么、怎么接话）；
# 想退回用完整写作人设（最贵，不推荐）就把它设为空字符串。
# gate_persona = ""
# 发言模型，同样写 `供应商/模型`；思考强度 off/minimal/low/medium/high。
# 默认 `gemini-3.8-flash`，走 apilio 默认接口（不必在 [oai.providers] 里再配）。
reply_model = "apilio/gemini-3.8-flash"
thinking = "low"
# 答疑那一轮（判定认出有人认真求助，或有人 @ 它问事）的思考强度与模型。
# 平常接话 low 就够；答疑要先想清楚再开口。help_model 留空沿用 reply_model。
help_thinking = "high"
help_model = ""
# 每群每小时最多紧急突破几次：判定认定「真要紧」（求救、被骗、设备要变砖、它自己
# 说错的话正在误导人）且分数够高时，冷却与每小时目标这些加价全部不算。0 关闭。
breakthrough_per_hour = 3
# 发言模型的采样温度。1.3 实测会把几个半截念头搅成一句，1.0 先把话说连贯；
# 口气的变化交给样本和人设。判定模型不跟着动。
temperature = 1.0
# 发言时额外开放的本地工具白名单（逗号分隔，可写 bash/read/write/edit/glob/grep）。
# read/write/bash 让它能在本轮工作目录里整理材料再当文件发出去。
# 聊天界面的 satori_* 工具由代码按下面的开关自动加上，不用写在这里。
# 不想让它跑命令就把 bash 去掉。
tools = "read,write,bash"
# 搭话指令：群里发一条以它打头的消息就跳过判定，直接把最近这段群聊交给人格。
# 指令本身不进上下文（人格只看到群友聊了什么），后面跟着的话照常算群聊内容。
# 它是一串普通文本，要带当前指令前缀写——改了上面的 command_prefix 就得一起改。
# 想关掉就写空字符串；peak.mode = "pause" 与 max_per_hour 仍然拦得住它。
summon_command = "/搭话"
# 群友还会怎么叫它：名片之外的小名、简称，如「n宝」「n 宝」「神尊大人」。
# 名片与账号昵称代码自己会去问平台，这里只补平台看不见的那些。
# 认出来只在聊天记录上加一个〔叫了你的名字〕的记号，不像 @ 那样跳过判定：
# 名字会撞车，把猜测当成点名会让它到处接话。少于两个字的一律不认。
aliases = []
# 平时介绍自己用的称呼，优先于群名片；留空沿用平台昵称。
preferred_name = ""
# 开口意愿分门槛，调高更沉默。实际门槛还会随「最近十分钟自己说了几轮」抬高
# （每轮 +8，最多 +24），随关注中的续聊下调 5 分，见 docs/ambient.md。
# 续聊折扣给得小是有意的：群里长期只聊一个话题时，「还在聊那个话题」会一直
# 为真，折扣一大就等于常年半价放行。
score_threshold = 60
speech_penalty_per_turn = 8
speech_penalty_cap = 24
focus_relief = 5
# 每轮最多 3 条消息、6 个平台写动作（含消息、点赞、撤回和失败尝试）。
messages_budget = 3
actions_budget = 6
# 送进模型的最近消息条数，以及随上下文一起给的图片张数（置 0 关闭图片判读）。
# 这两项决定判定与发言各自看到的「眼前这一段」有多长，也直接决定每轮花的 token。
context_turns = 20
context_images = 2
# 一条消息大约多少字就该换气：一段话长过约一条半时，在句末标点、汉字之间的空格或
# 句中逗号处切成几条依次发出（总数仍受 messages_budget 约束，带换行和标记的不切）。
# 给得宽是有意的：群里的长句多半像「语音输入一条说完」，短句才像手打；只有真成了
# 一坨才该拆。0 关闭自动分段。
split_chars = 60
# 一条发言里的文字超过多少字就排成一页 Markdown 图再发；0 关闭。认真答疑时该讲的
# 照讲，只是不再把几百字直接贴进群。整批话都是字、又合起来够长时会并成一张图；
# 带图、文件、@ 的照原样发。渲染失败会退回原文。
long_text_chars = 240
# 每轮最多生成几张图（走 [oai] 配置的图像模型）；0 关闭绘图。
draw_budget = 2
# 每轮最多生成几首歌（走 [oai] 配置的音乐供应商，一次出两个版本）；0 关闭写歌。服务可能收费。
music_budget = 1
# 每轮最多生成几段视频（走 [oai] 配置的视频接口）；0 关闭视频生成。服务可能收费。
video_budget = 1
# 表情包库上限；普通图片保存在 data/oai/chat/stickers/，并与 Agent 房间共用。
# 超出上限时清理较少使用的项目；0 关闭收藏。
sticker_max = 120
# 消息时效窗口（秒）：请求交给 satori-qq 之后还要排队，这段时间里群里只要又有人
# 说话，这一句就整条不发——话说晚了不如不说。0 关闭这层条件。
send_freshness_seconds = 25
# 发送前短暂显示 QQ 原生正在输入；内核接口尚未实机确认，默认关闭。
qq_typing = false
# 回复前标记本群 QQ 已读；实验性，默认关闭。
qq_mark_read = false
# 被直接点名问「你是不是机器人」时，偶尔用 QQ 本群近期消息生成一张聊天记录图回应。
# 图并不证明真人身份，图片与文字会发回原群；默认关闭，只有确认群友接受后才打开。
screenshot_on_suspicion = false
# 同一群至少间隔六小时，配置再小也会限制为一小时一次。
screenshot_cooldown_seconds = 21600
# 熟人记忆：落盘记住群里的人与旧事（data/ambient/memory/），并开放 satori_memo。
memory_enabled = true
# 每轮最多写几条记忆；0 关闭 satori_memo。
memo_budget = 3
# 按作息与互动起伏的内部状态（data/ambient/mood.json）：影响开口门槛、打字快慢
# 和提示词里那句「你现在的状态」。关掉则任何时刻都一个样。作息基线是号主本人的真实
# 在线节奏（scripts/owner-rhythm.py 量出来的表，写在 src/plugins/ambient/mood.rs）。
mood_enabled = true
# 复盘：群里新来 24 条以上、距上次 25 分钟以上、不在计价高峰时，后台用判定模型把
# 群聊整理成几摊事、对人的新印象、新梗与自己说过的话，写进群记忆。一次便宜的调用；
# 需要 memory_enabled。
reflect_enabled = true
# 随口一句：判定分数落在 quick_floor 与开口门槛之间（想吭一声、可不吭）、现场够新、
# 两分钟没开过口、本人不在时，按 45% 几率只回一两个字（不调用发言模型）。
# quick_per_hour 是每群每小时上限，0 关闭。
quick_per_hour = 4
quick_floor = 38
# 号主本人在线时机器人让位（同一个号，不抢话）：他在这个群亲手打字之后
# owner_quiet_seconds 秒内不主动接话；这期间有人点名，先等 owner_grace_seconds 秒让他
# 自己答，他开口了这条点名就归他。0 分别关闭这两层。
owner_quiet_seconds = 480
owner_grace_seconds = 75

# 默认不因沉默而强行降低门槛。
silence_relief_per_10min = 0
silence_relief_cap = 0
# 两条软钉子，专治「聊嗨了停不下来」：两次主动开口之间的时间下限，以及每群每小时的
# 目标轮数。两个都是**抬价而不是拦人**——刚说过话、这个小时说超了，开口门槛就往上加
# （`cooldown_penalty`、`budget_penalty`），一路加上去；群里真有人顺着它的话问下去时
# 分数自然高，抬高的门槛挡不住那一句。被 @ 与搭话指令走的是另一条路，不受这两个影响。
# 真嫌吵就把窗口拉长、罚款加重、目标调小；想要完全由人格自主控制节奏，写 0。
cooldown_seconds = 150
cooldown_penalty = 18
max_per_hour = 5
budget_penalty = 12
# 人格可选择短期跟进某位群友或话题，并在互动中续期。
# 关注意味着续聊判定为真、门槛打折（软钉子照旧），给太久会让一个不变的话题一直挂着。
focus_max_seconds = 180
# 一阵消息静默 6 秒才算完（最多等 40 秒）；没人叫它时隔约 90 秒（0.6–1.5 倍随机）
# 扫一眼群，正聊着时缩到三分之一。@、引用、戳、喊名字和「救命」「在线等」这类不等。
debounce_seconds = 6
max_pending_seconds = 40
gate_interval_seconds = 90
# 判定一轮最多花多少秒；超时按「不说话」算。这是每群固定要付的等待成本，
# 调大只会让群里等得久，不会让它更聪明。
gate_timeout_seconds = 45
# 一轮发言的总预算（秒），含模型思考与工具调用。
reply_timeout_seconds = 240
# 判定完到真正开口之间大约想几秒（拟人停顿）。
think_seconds = 3.0
# 打字速度（字/分钟），调低更像在慢慢敲。
typing_cpm = 150
# 语音条的播放速度（字/分钟），只影响发语音时的时长换算。
voice_cpm = 420
# 联网搜索（走 [oai.search] 配的后端）与每轮预算；0 关闭。
search_enabled = true
search_budget = 3
# 别人 @ 它时是否必答。关掉之后点名也要过判定。
reply_on_mention = true

# 跟着 DeepSeek 的计价时段作息：官方接口空闲时段半价，高峰是北京时间周一至周五
# 9:00-12:00、14:00-18:00。搭话是这里唯一无人触发的付费功能，最值得挑时段。
# **只对走 DeepSeek 接口的模型生效**：gate_model / reply_model 两个都不在 DeepSeek
# 上时（比如都改用小米 MiMo），这一整段让路，全天照常跑。换回 DeepSeek 不用改这里。
# mode：swap  高峰照常跑，只把模型换成下面的替补（要配 model 才有意义，最省事）
#       sleep 睡着（不跟着消息频率一直判定，偶尔接一句，被 @ 时立刻醒）
#       pause 高峰时段完全不出声 / normal 不理会时段，连替补也不换
[ambient.peak]
mode = "sleep"
windows = ["09:00-12:00", "14:00-18:00"]
weekdays = [1, 2, 3, 4, 5]
# 高峰时段顶上来的模型（`供应商/模型`）。峰谷价只跟 DeepSeek 一家有关，换一家就没有
# 高峰这回事，账单不再翻倍。需要 [oai.providers] 里有这个供应商。
# mode = "swap"：节奏、联网、看图、绘图都跟平时一样，只把判定与发言两个模型换成它。
# mode = "sleep"：睡着醒来那一轮也用它，并连上下文一起省（不看图、不联网、不绘图）。
# 留空（默认）表示不换，仍用上面的 gate_model / reply_model。例如小米 MiMo：
# model = "mimo/mimo-v2.6-flash"
model = ""
# 睡着时两次主动判定之间的最短间隔（秒），把判定压成「隔一会儿看一眼」。
# 写 0 表示完全睡着、只有被点名才醒；其余夹到 30-3600 秒。
doze_gate_seconds = 0
# 睡着时每小时最多自主开口几次（不含被点名与搭话指令）：判定便宜、开口贵，
# 这条给高峰时段真正花钱的发言一个硬上限。写 0 表示不额外限制。
doze_reply_limit = 2

# AI 资讯推送：资讯、热点、日报与模型榜（数据源 AIHOT），引用卡片后回序号取链接。
[ai_news]
enabled = true

# —— 推送目标 ——
# 群号与私聊分别存，同号不会混淆。这两个列表用指令增删更省事：
#   /ai推送添加 群 123456 · /ai推送删除 群 123456 · /ai推送列表
groups = ["175131947"]
private_users = []

# —— 抓取参数 ——
# 手动 /ai资讯 查询用的动态池；主动推送的数据源策略不受这一项影响。
mode = "selected"
# 时间窗。AIHOT v1 只支持 24h 与 7d。
window = "24h"
# 分类过滤：ai-models / ai-products / industry / paper / tip（教程）/ opinion（观点）；
# 留空表示不限。与官网六个分类一一对应。
category = ""
# 单次推送最多几条（1—100）。
limit = 30
# 去重后新事件少于这个数就本轮不推，避免只有一条也刷屏。
min_items = 1
# 同一条资讯的去重记忆天数。
dedupe_days = 7
# 同一件事的多家报道折成一条，卡片上写「另有 N 家信源报道」，与官网首页一致。
# 接口逐篇返回、没有这层归并，关掉就是一家报一条。
fold_same_event = true
# 单次请求超时（秒）。
request_timeout_seconds = 15

# —— 展示 ——
# 摘要截断长度（按字符计）。
summary_max_chars = 90
# 是否展示 AIHOT 的「推荐理由」。它与摘要大多是同一件事换个说法再讲一遍，默认不展示。
show_reason = false
# 是否附带第三方原文链接（AIHOT 站内阅读页始终保留）。
show_original_link = true
# 日报卡片最多展示几条。
daily_max_blocks = 12
# 周报、月报卡片最多展示几条。各栏目轮流取，不会被头两栏占满。
period_max_items = 18
# 是否把资讯排版成卡片图。开启时一级推送只发图片，链接由引用卡片后回序号提取；
# 关掉则发纯文本与可点链接。
image_enabled = true
# 卡片图最多展示几条；其余条目可以通过「引用卡片回复 0」一次取全部。
image_max_items = 10
# 提取结果或纯文本兜底超过多少字符时改用合并转发；0 表示永远发纯文本。
forward_threshold_chars = 500
# 用合并转发时，单个节点的字符软上限。
forward_node_chars = 300
# 卡片图渲染倍率（1—4）。
image_scale = 3.0
# 卡片主题：auto（北京时间 07:00—18:59 白天，其余夜晚）/ light / dark。
card_theme = "auto"
# 多个群之间的最小与最大发送间隔（秒）。实际间隔在两者之间随机，
# 避免所有群在同一秒收到推送，也避开 QQ 的风控节奏。
send_interval_seconds = 8
send_interval_max_seconds = 35

# —— 模型榜 ——
# /ai模型榜 单次展示的模型条数（1—30）。
leaderboard_max_items = 12
# 模型榜数据的本地缓存时长（分钟）；榜单每天只更新几次，不必每次指令都抓一遍。
leaderboard_cache_minutes = 30

# —— 实时推送 ——
# 实时快报总开关：动态池一有有效资讯就推，不必等下一个定时档。
realtime_enabled = true
# 实时快报来源：selected（精选，默认低干扰）/ all（全量）。
realtime_mode = "selected"
# 轮询间隔（秒）。低于 60 秒无意义：AIHOT 的 CDN 缓存就是 60 秒，更密只会拿到同一份副本。
realtime_interval_seconds = 60
# 保鲜期（分钟）：只推官网时间轴上落在此之内的条目。Bot 离线一天再上线时，
# 不会把这一天的旧闻当成「刚刚发生」补发一遍。
realtime_max_age_minutes = 1440
# 单次实时推送最多几条，多出来的留到下一轮。
realtime_max_items = 30
# 每个群每小时最多实时推送几次，防止爆发日刷屏。
realtime_max_per_hour = 60
# 夜间免打扰（静默时段）的起点与终点（HH:MM），例如 23:00 与 07:00。
# 起止相同或留空 = 全天推送（默认）。跨午夜按跨天处理。
# 静默期内不抓取、不推送；结束后也不补发夜里攒下的资讯，避免清晨被一串迟到的快报吵醒。
realtime_quiet_start = ""
realtime_quiet_end = ""
# 只收定时档、不收实时快报的目标。用指令更省事：/ai实时关闭 · /ai实时开启。
realtime_muted_groups = []
realtime_muted_private_users = []
# —— 排期（按北京时间）——
# 精选速递：一天推几档，时间点可配置多个（HH:MM:SS）。
brief_enabled = true
brief_times = ["12:50:00", "20:10:00"]
# 日报：每天一条汇总。
daily_enabled = true
daily_time = "08:20:00"
# 周报：官方每周一 10:00 出刊；任务每天都来看一眼，只有出刊三天内的新刊才推，
# 同一期只推一次。所以这里是「几点来看」，不是「周几推」。
weekly_enabled = true
weekly_time = "10:40:00"
# 月报：官方每月 1 日 10:30 出刊，规则同周报。
monthly_enabled = true
monthly_time = "10:50:00"
# 热点榜：每天一条 Top 10。
hot_topics_enabled = true
hot_topics_time = "21:40:00"

# 按目标覆盖分类与静默时段。键是群号，或私聊的 `private:<QQ号>`；
# 用 /ai分类 与 /ai静默 写进去，一般不必手改。空值表示继承全局。
[ai_news.group_preferences]

# ============================================================================
# 统计 · 资讯
# ============================================================================

# 词云：按消息记录生成词云图。数据来自 [recorder]，关掉它这里只会说没有记录。
[wordcloud]
enabled = true
# 成图的排版画布宽高（像素）与取词数量上限。画布只决定词排得开不开：
# 出图会把内容外的暖白裁掉，所以成图尺寸跟着词量走，不必为了让图好看调小画布。
width = 800
height = 600
limit = 50
# 约三成的词竖排：字保持正的、自上而下排成一列（英文词转 90°）。false 则全部横排。
vertical = true
# 一次最多读多少条原始记录。放大它更全面，代价是出图前那一段等待。
max_msg = 50000

# 统计图表：发言、表情、消息类型排行榜与走势，支持早中晚与周月的错峰定时推送。
[stats]
enabled = true
# 成图的宽高（像素）。
width = 960
height = 800
# 中文字体。留空按 font_family 让系统自己找；两者都不合适才写 font_path 指到字体文件。
font_family = "Noto Sans CJK SC"
font_path = ""
# 排行榜色带上的构图线与发言条谁盖谁。这组竖线不表示任何数值，等距排布只为给
# 右半边那片留白一点落点。
# true：线画在最上层，从榜首通到榜尾，格子不被任何一根条打断；
# false：实色条盖住它，每根条都是完整的一块颜色。
#   /ctl set stats ranking_grid_over_bars false
ranking_grid_over_bars = true
# 排行榜的次数与占比写在哪儿。
# true：紧跟在自己那根条的尾巴后面——眼睛被条的颜色牵到条尾，答案就在那里，
#       中间不用换一次视线；代价是二十个数字排成一串阶梯。
# false：右对齐成固定的两列——上下扫一眼就能比大小、画面更齐整；代价是读完条
#       还得横着扫到画面最右边，再回头认这是哪一行。
#   /ctl set stats ranking_value_follows_bar false
ranking_value_follows_bar = true
# 排行榜默认列出多少名。指令后面跟数字可以临时改：「本群今日发言排行榜 30」。
#   /ctl set stats ranking_limit 30
ranking_limit = 20
# 指令里那个数字的上限，超过按上限出图（一行约 120 像素，100 名已是万把像素的长图）。
ranking_max_limit = 100
# 定时推送的条数门槛：这批消息少于这么多就不推，免得冷清的群每天收到一张空的图。
push_min_messages = 20
# 定时推送是否先发一条文字提示（小结、数字、标题等），再发结果图。
# 默认 false：保持静默，只把结果图片发进群，不输出任何文字。
#   /ctl set stats push_text_enabled true
push_text_enabled = false
# 多个群之间的发送间隔区间（秒），错峰用。
push_group_gap_min_seconds = 20
push_group_gap_max_seconds = 75

# —— 排期（按北京时间）——
# 早报、午报、日报、周报、月报各一个开关与时间点。
morning_recap_enabled = true
morning_recap_time = "09:00:00"
noon_brief_enabled = true
noon_brief_time = "12:30:00"
daily_push_enabled = true
daily_push_time = "23:30:00"
weekly_recap_enabled = true
weekly_recap_time = "10:00:00"
monthly_recap_enabled = true
monthly_recap_time = "10:20:00"

# 群名单：查询指令与主动推送共用这一份，语义对所有带名单的插件一致——
# 只配 black：除名单内的群以外，所有群都生效并推送；
# 只配 white：只有名单内的群生效并推送；
# 两个都空：对所有群生效。同时出现在两边时黑名单优先。
#   /ctl set stats channel.black ["123456789"]
[stats.channel]
white = []
black = []
