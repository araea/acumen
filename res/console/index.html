<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<!-- 状态栏与地址栏的底色取顶栏那一层（surface-container-low），不取页面底色：
     装到桌面之后系统把这一段和顶栏接在一起，对不上就会有一条看得见的接缝。
     两个值与 res/cards/m3e.css 里 body.scheme-console(.dark) 的那两行必须一致。 -->
<meta name="theme-color" content="#f5f7f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171d1a" media="(prefers-color-scheme: dark)">
<meta name="description" content="知微的控制台：本机运行状况、插件、搭话与日志。">
<meta name="application-name" content="知微">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="知微">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<title>知微</title>
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/app.css">
</head>
<body class="scheme-console layout-compact">
<a class="skip-link" href="#view">跳到内容</a>
<div class="shell">
  <header class="bar">
    <span class="brand">
      <img class="brand-mark" src="/icon.svg" alt="" width="24" height="24">
      <span class="brand-name">知微</span>
    </span>
    <span class="bar-title" id="bar-title" aria-hidden="true">总览</span>
    <span class="bar-spacer"></span>
    <button class="btn btn-icon" id="refresh" type="button" title="刷新这一页" aria-label="刷新这一页"></button>
    <button class="btn btn-icon" id="settings" type="button" title="接入与全局设置" aria-label="接入与全局设置"></button>
  </header>
  <nav class="nav" id="nav" aria-label="主要"></nav>
  <main class="main"><div class="page" id="view" tabindex="-1"></div></main>
</div>
<!-- 反馈条的宿主。它自己不挂 aria-live：播报的轻重按每条反馈定
     （成功与进行中是 status、失败是 alert），挂在这里就只能一刀切。 -->
<div id="snack"></div>
<dialog id="dialog" class="dialog" aria-labelledby="dialog-title" aria-describedby="dialog-body"></dialog>
<noscript><div class="lock">
  <p class="note">这一页要开着 JavaScript 才能跑。
  地址与口令可以从启动日志里那条带 <span class="key">?t=</span> 的地址拿，
  或者在本机敲 <span class="key">./bot ui url</span>。改配置也可以用群里的
  <span class="key">/ctl</span>。</p>
</div></noscript>
<script src="/app.js"></script>
</body>
</html>
