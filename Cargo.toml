[package]
name = "acumen"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "群聊机器人：经 Satori 协议接入多个聊天平台，以可插拔插件提供 AI 对话、群管与媒体处理能力。"

[dependencies]
# 错误处理
anyhow = "1.0"

# 文本处理
jieba-rs = "0.10"     # 中文分词
regex = "1.13"        # 正则表达式
pulldown-cmark = "0.13" # Markdown 解析
glob = "0.3"          # 内置 agent 的文件匹配工具
encoding_rs = "0.8"   # 二维码里非 UTF-8 的中文（GBK 等）转码
walkdir = "2"         # 内置 agent 的目录遍历工具

# 序列化与反序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
simd-json = "0.18"
toml = "1.1"

# 加密与哈希
md5 = "0.8"
base64 = "0.23"

# 网络与 HTTP
reqwest = { version = "0.13", default-features = false, features = ["rustls", "system-proxy", "http2", "charset", "json", "multipart"] }
http = "1.5"
url = "2.5"
tokio-tungstenite = "0.30"  # WebSocket
quick-xml = "0.42"           # Satori 消息元素解析
rig-core = { version = "0.42", default-features = false, features = ["reqwest", "rustls"] }  # OpenAI 兼容补全

# 异步运行时与工具
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"

# 本机控制台（App 的图形界面与终端共用同一个后端）。
# 只绑回环地址、且要口令，见 src/plugins/console/mod.rs。
axum = { version = "0.8", default-features = false, features = [
    "http1",
    "tokio",
    "json",
    "query",
] }

# 数据库
sea-orm = { version = "2.0", features = [ "sqlx-sqlite", "runtime-tokio-rustls", "macros" ] }

# 图像处理与生成
image = "0.25"
plotters = { version = "0.3", default-features = false, features = ["all_elements", "all_series", "bitmap_backend", "bitmap_encoder", "bitmap_gif", "chrono", "colormaps", "deprecated_items", "full_palette", "image", "svg_backend", "ab_glyph"] }         # 图表绘制
ab_glyph = "0.2"      # 原生文字光栅化
fontdb = "0.24"       # 字体处理
araea-wordcloud = "0.1.14"   # 词云生成
cdp-html-shot = "0.3.0"     # HTML 截图
rxing = { version = "0.9", default-features = false, features = ["qrcode", "decoders", "multi_barcode_readers", "encoding_rs"] }  # 二维码识别（zxing-cpp 的 Rust 移植，耗时有界）
qrcode = { version = "0.14", default-features = false }  # 文字转二维码（只用编码，自己按整数像素画图）

# 时间与随机数
chrono = "0.4"
rand = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2" # 取消时终止同组工具进程

# 调试构建里二维码识别（rxing）与图像解码慢一个数量级，测试里的大图要跑很久；
# 这两个依赖只编一次，优化它们几乎不增加构建时间。
[profile.dev.package.rxing]
opt-level = 3
[profile.dev.package.image]
opt-level = 3
