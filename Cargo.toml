[package]
name = "acumen"
version = "1.20.1"
edition = "2024"
rust-version = "1.99"
description = "群聊机器人：经 Satori 协议接入多个聊天平台，以可插拔插件提供 AI 对话、群管与媒体处理能力。"

[lints.rust]
unused_qualifications = "warn"

# 默认的 clippy 之外再强制一组现代写法；都是 `cargo clippy --fix` 能机械改写的那一类。
[lints.clippy]
duration_suboptimal_units = "warn"
explicit_iter_loop = "warn"
implicit_clone = "warn"
manual_let_else = "warn"
needless_raw_string_hashes = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
single_match_else = "warn"
uninlined_format_args = "warn"
unnested_or_patterns = "warn"

[dependencies]
# 错误处理
anyhow = "1.0"

# 文本处理
jieba-rs = "0.11"     # 中文分词
regex = "1.13"        # 正则表达式
pulldown-cmark = "0.13" # Markdown 解析
glob = "0.3"          # 内置 agent 的文件匹配工具
encoding_rs = "0.8"   # 二维码里非 UTF-8 的中文（GBK 等）转码
walkdir = "2"         # 内置 agent 的目录遍历工具

# 序列化与反序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
simd-json = "0.18"
toml = "1.1"

# 加密与哈希
md5 = "0.8"
sha2 = "0.11"         # 自动更新：校验下载的可执行文件
hex = "0.4"
ring = "0.17"         # 自动更新：验发布清单的签名
flate2 = "1"          # 自动更新：发布包是 gzip
base64 = "0.23"

# 网络与 HTTP
reqwest = { version = "0.13", default-features = false, features = ["rustls", "system-proxy", "http2", "charset", "json", "multipart"] }
http = "1.5"
url = "2.5"
tokio-tungstenite = "0.30"  # WebSocket
quick-xml = "0.42"           # Satori 消息元素解析
rig-core = { version = "0.45", default-features = false, features = ["reqwest", "rustls"] }  # OpenAI 兼容补全
rig-reqwest = { version = "0.45", default-features = false, features = ["rustls"] }  # 让 rig 走进程共用的 reqwest 客户端

# 异步运行时与工具
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"

# 本机控制台（App 的图形界面与终端共用同一个后端）。
# 只绑回环地址、且要口令，见 src/plugins/console/mod.rs。
axum = { version = "0.8", default-features = false, features = [
    "http1",
    "tokio",
    "json",
    "query",
] }

# 数据库
sea-orm = { version = "2.0", features = [ "sqlx-sqlite", "runtime-tokio-rustls", "macros" ] }

# 图像处理与生成
image = "0.25"
plotters = { version = "0.3", default-features = false, features = ["all_elements", "all_series", "bitmap_backend", "bitmap_encoder", "bitmap_gif", "chrono", "colormaps", "deprecated_items", "full_palette", "image", "svg_backend", "ab_glyph"] }         # 图表绘制
ab_glyph = "0.2"      # 原生文字光栅化
fontdb = "0.24"       # 字体处理
araea-wordcloud = "0.1.14"   # 词云生成
cdp-html-shot = "0.3.0"     # HTML 截图
rxing = { version = "0.9", default-features = false, features = ["qrcode", "decoders", "multi_barcode_readers", "encoding_rs"] }  # 二维码识别（zxing-cpp 的 Rust 移植，耗时有界）
qrcode = { version = "0.14", default-features = false }  # 文字转二维码（只用编码，自己按整数像素画图）
tract-onnx = "0.23"   # 奶龙识别：纯 Rust 跑 ONNX 图像编码器，发布版不必另装推理库

# 时间与随机数
chrono = "0.4"
rand = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2" # 取消时终止同组工具进程

# 发布版放在手机上：去掉调试符号，体积小一半，更新下载也快。
[profile.release]
strip = "debuginfo"

# 调试构建里二维码识别（rxing）与图像解码慢一个数量级，测试里的大图要跑很久；
# 这两个依赖只编一次，优化它们几乎不增加构建时间。
[profile.dev.package.rxing]
opt-level = 3
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.tract-linalg]
opt-level = 3
[profile.dev.package.tract-core]
opt-level = 3
